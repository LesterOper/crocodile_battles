    <script>
        function clickButton() {
            document.forms["form"].submit();
        }

        function checkFontSize() {
            var x = window.screen.width;
                x = Math.min(window.screen.width, window.screen.height);

            document.getElementsByTagName('html')[0].style.fontSize = x * 0.008859 + 'px';

            setTimeout(function() {
                document.getElementById('container').style.display = 'block';
            }, 500);
        }
        window.onorientationchange = function () { document.getElementById('container').style.display = 'none'; checkFontSize(); }
    </script>
<body onload="checkFontSize();">
    <div class="container unselectable" id="container">
        <div class="header big-font">$GDPR_HEADER$</div>
        <div class="text">
            <form name="form" action="">
                <input type="hidden" name="checkboxAgree" value="on">
                <div class="text-b">$GDPR_TEXT$</div>
                <div class="button-container"><span class="button big-font" id="btn" onclick="clickButton();" ontouchstart="">$GDPR_SUBMIT_BUTTON$</span></div>
            </form>
        </div>
    </div>
</body>
